[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
simulation = { path = "crates/simulation" }
client = { path = "crates/client" }
bevy = "0.19.1"
bevy_egui = "0.42"
hashbrown = "0.17.1"
noise = "0.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_types = "warn"
disallowed_methods = "warn"
